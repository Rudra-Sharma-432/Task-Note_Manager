<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>

    <link rel="stylesheet" href="style/index.css" />
  </head>

  <body>
    <div id="root">
      <h1>Task Manager</h1>

      <hr id="title-underline">

      <div id="manage-buttons">
        <button id="create-task-button">Create New Task</button>
        <button id="clone-task-button" class="">Clone A Task</button>
      </div>

      <div id="create-task-div" class="hidden">
        <h2>Create A New Task</h2>
        <button id="close-create-task-div-button" class="x-button">✖</button>
        <input id="task-name-input" type="text" placeholder="Task Name">
        <div>
          <label for="statuses">Status:</label>
          <select name="statuses" id="create-statuses">
            <option value="Not Started">Not Started</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
            <option value="On Hold">On Hold</option>
            <option value="Blocked">Blocked</option>
          </select>
        </div>
        <textarea id="task-description-input" type="text" placeholder="Task Description"></textarea>
        <button id="add-task-button">Add The Task</button>
      </div>


      <div id="view-task-div" class="hidden">
        <h2>Task Viewer</h2>
        <button id="close-view-task-div-button" class="x-button">✖</button>
        <h3 id="task-heading"></h3>
        <p id="view-status">Status: <span id="view-status-span">In Progress</span></p>
        <p id="task-pera"></p>
        <button id="edit-task-button">Edit Task</button>
      </div>


      <div id="edit-task-div" class="hidden">
        <h2>Edit The Task</h2>
        <button id="close-edit-task-div-button" class="x-button">✖</button>
        <input id="task-name" type="text" placeholder="Task Name">
        <div>
          <label for="statuses">Status:</label>
          <select name="statuses" id="statuses">
            <option value="Not Started">Not Started</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
            <option value="On Hold">On Hold</option>
            <option value="Blocked">Blocked</option>
          </select>
        </div>
        <textarea id="task-description" type="text" placeholder="Task Description"></textarea>
        <button id="update-task-button">Update Task</button>
      </div>

      <hr>

      <p id="message" class="hidden" style="justify-self: center; font-size: 22px; margin-top: 40px;">No tasks yet — create one!</p>


      <div id="tasks-div">

        </div> -->

    </div>
    <script src="src/utils.js"></script>
    <script src="src/index.js"></script>
  </body>

</html>
